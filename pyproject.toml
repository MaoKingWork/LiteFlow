[project]
name = "liteflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "markdown2>=2.5.5",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
agentkit = "agentkit.cli:main"

[project.optional-dependencies]
doc-convert = [
    "markdown2>=2.5.5",
    "reportlab>=4.0",
    "python-docx>=1.2",
]
server = [
    "fastapi>=0.110",
    "starlette>=0.36",
    "sse-starlette>=2.0",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fastapi>=0.110",
    "starlette>=0.36",
    "sse-starlette>=2.0",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["src/agentkit/tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
