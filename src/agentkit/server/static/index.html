<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiteFlow Studio</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%2300E5FF' d='M13 2 3 14h7l-1 8 10-12h-7l1-8z'/></svg>">
</head>
<body>
<div id="app" class="lf-app">

  <!-- ══════════ 顶栏 ══════════ -->
  <header class="lf-topbar">
    <div class="lf-topbar-left">
      <span class="lf-logo" title="LiteFlow Studio">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        <b>LiteFlow</b><span class="lf-logo-sub">Studio</span>
      </span>
      <span id="wf-name" class="lf-wf-name mono">—</span>
      <span id="wf-dirty" class="lf-dirty-dot" data-i18n-title="topbar.dirty" hidden>●</span>
    </div>
    <div class="lf-topbar-actions">
      <button id="btn-validate" class="lf-btn" data-i18n="topbar.validate" data-i18n-title="topbar.validateTitle">校验</button>
      <button id="btn-save" class="lf-btn lf-btn-primary" data-i18n="topbar.save" data-i18n-title="topbar.saveTitle">保存</button>
      <span class="lf-topbar-sep"></span>
      <button id="btn-import" class="lf-btn" data-i18n="topbar.import" data-i18n-title="topbar.importTitle">导入</button>
      <button id="btn-export" class="lf-btn" data-i18n="topbar.export" data-i18n-title="topbar.exportTitle">导出</button>
      <span class="lf-topbar-sep"></span>
      <button id="btn-run" class="lf-btn lf-btn-run" data-i18n-title="topbar.runTitle">
        <svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <span data-i18n="topbar.run">运行</span>
      </button>
      <select id="lang-switch" class="lf-lang-switch" data-i18n-title="topbar.langTitle">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <span id="conn-status" class="lf-conn"></span>
    </div>
  </header>

  <div class="lf-body">
    <!-- ══════════ 左栏:工作流列表 + 节点面板 ══════════ -->
    <aside class="lf-sidebar">
      <section class="lf-side-section">
        <div class="lf-side-head">
          <span data-i18n="sidebar.workflows">工作流</span>
          <button id="btn-new-wf" class="lf-icon-btn" data-i18n-title="sidebar.newWorkflow">＋</button>
        </div>
        <div id="wf-list" class="lf-wf-list"></div>
      </section>
      <section class="lf-side-section lf-side-grow">
        <div class="lf-side-head"><span data-i18n="sidebar.nodes">节点</span></div>
        <div id="palette" class="lf-palette"></div>
      </section>
    </aside>

    <!-- ══════════ 中央画布 ══════════ -->
    <main class="lf-canvas-wrap">
      <div id="canvas" class="lf-canvas" tabindex="0"></div>
    </main>

    <!-- ══════════ 右栏:属性 / 运行 / 产物 / 诊断 ══════════ -->
    <aside class="lf-right">
      <nav class="lf-tabs">
        <button class="lf-tab is-active" data-tab="props" data-i18n="tab.props">属性</button>
        <button class="lf-tab" data-tab="run" data-i18n="tab.run">运行</button>
        <button class="lf-tab" data-tab="artifacts" data-i18n="tab.artifacts">产物</button>
        <button class="lf-tab" data-tab="diag"><span data-i18n="tab.diag">诊断</span><span id="diag-badge" class="lf-badge" hidden></span></button>
      </nav>
      <div class="lf-tabpanes">
        <section id="pane-props" class="lf-pane is-active"></section>
        <section id="pane-run" class="lf-pane"></section>
        <section id="pane-artifacts" class="lf-pane"></section>
        <section id="pane-diag" class="lf-pane"></section>
      </div>
    </aside>
  </div>

  <!-- ══════════ 产物预览 / 通用模态 ══════════ -->
  <div id="modal-root" class="lf-modal-root" hidden>
    <div class="lf-modal-mask" data-close></div>
    <div class="lf-modal">
      <div class="lf-modal-head">
        <span id="modal-title" class="lf-modal-title mono"></span>
        <div class="lf-modal-actions" id="modal-actions"></div>
        <button class="lf-icon-btn" data-close data-i18n-title="topbar.close">✕</button>
      </div>
      <div id="modal-body" class="lf-modal-body"></div>
    </div>
  </div>

  <div id="toast-root" class="lf-toast-root"></div>
  <input id="import-file" type="file" accept=".yaml,.yml,.json" hidden>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
