# AI 短篇小说最佳实践:角色设定 → 并发双版本生成 → 评委打分 → 输出最优
#
# 演示能力:LLM JSON 输出 / ParallelStep 并发 / LoopStep append 增量累加 /
#           ConditionStep 条件选择 / md.convert 文件输出
#
# 运行方式:
#   python -m agentkit.cli run examples/story_best_practice.yaml --input protagonist=大米 --verbose

name: story_best_practice

inputs:
  - protagonist

providers:
  - name: mimo
    api_key: sk-***
    model: mimo-v2.5
    options:
      thinking: disabled

agents:
  # 角色设定师:输出结构化主角档案
  - name: character_designer
    model: mimo-v2.5
    provider: mimo
    system: |
      你是资深角色设计师,擅长为小说构建立体的人物设定。
      严格输出 JSON,不要附加任何说明文字。
    temperature: 0.6

  # 风格 A:热血冒险向
  - name: writer_ardent
    model: mimo-v2.5
    provider: mimo
    system: |
      你是擅长热血冒险风格的小说家,节奏明快、冲突强烈、画面感强。
      根据上下文续写章节,保持文风一致与剧情连贯。
    temperature: 0.9

  # 风格 B:细腻抒情向
  - name: writer_lyric
    model: mimo-v2.5
    provider: mimo
    system: |
      你是擅长细腻抒情风格的小说家,注重心理刻画、氛围渲染、语言优美。
      根据上下文续写章节,保持文风一致与剧情连贯。
    temperature: 0.7

  # 评委:对比两版并给出结构化裁决
  - name: judge
    model: mimo-v2.5
    provider: mimo
    system: |
      你是公正严谨的文学评委。对比两部小说后严格输出 JSON,不要附加说明文字。
    temperature: 0.2

  # 评报告撰写人:把裁决转为人类可读报告
  - name: reviewer
    model: mimo-v2.5
    provider: mimo
    system: |
      你是文学评论撰稿人,把结构化评分转为专业可读的 Markdown 书评报告。
    temperature: 0.4

steps:
  # 1. 生成主角档案(名称/年龄/背景/故事类型)
  - id: setup_character
    type: llm
    agent: character_designer
    output_format: json
    prompt: |
      请为名为"{{protagonist}}"的主角设计一份短篇小说人物档案。
      严格输出如下 JSON(不要 markdown 代码块,不要额外文字):
      {
        "name": "主角名",
        "age": 年龄数字,
        "background": "100字以内的背景设定",
        "story_type": "故事类型,如奇幻/悬疑/科幻/言情"
      }
    output: character_profile

  # 2. 并发生成两个版本(风格差异化),每个 loop 增量累加 3 章
  - id: generate
    type: parallel
    max_concurrency: 2
    timeout: 180
    branches:
      # 版本 A:热血冒险风格
      - id: gen_v1
        type: loop
        iter: "[1, 2, 3]"
        as: chapter_num
        output_mode: append
        output: story_v1
        separator: "\n\n"
        step:
          id: write_v1
          type: llm
          agent: writer_ardent
          prompt: |
            主角档案:
            - 姓名:{{character_profile.name}}
            - 年龄:{{character_profile.age}}
            - 背景:{{character_profile.background}}
            - 故事类型:{{character_profile.story_type}}

            {{#if story_v1}}
            前文(完整,禁止修改):
            ---
            {{story_v1}}
            ---

            任务:续写第{{chapter_num}}章。
            {{#else}}
            任务:为上述主角创作第1章。
            {{/if}}
            输出格式(严格遵守):
            - 必须以 `## 第{{chapter_num}}章 标题` 开头
            - 只输出本章新内容,严禁重复前文
            - 字数 600-900 字
            - 不要输出任何说明性文字
          output: story_v1

      # 版本 B:细腻抒情风格
      - id: gen_v2
        type: loop
        iter: "[1, 2, 3]"
        as: chapter_num
        output_mode: append
        output: story_v2
        separator: "\n\n"
        step:
          id: write_v2
          type: llm
          agent: writer_lyric
          prompt: |
            主角档案:
            - 姓名:{{character_profile.name}}
            - 年龄:{{character_profile.age}}
            - 背景:{{character_profile.background}}
            - 故事类型:{{character_profile.story_type}}

            {{#if story_v2}}
            前文(完整,禁止修改):
            ---
            {{story_v2}}
            ---

            任务:续写第{{chapter_num}}章。
            {{#else}}
            任务:为上述主角创作第1章。
            {{/if}}
            输出格式(严格遵守):
            - 必须以 `## 第{{chapter_num}}章 标题` 开头
            - 只输出本章新内容,严禁重复前文
            - 字数 600-900 字
            - 不要输出任何说明性文字
          output: story_v2

  # 3. 评委对比打分,输出结构化裁决
  - id: judge
    type: llm
    agent: judge
    output_format: json
    prompt: |
      你正在评审主角"{{character_profile.name}}"的两部同题短篇小说。

      【版本 A】
      {{story_v1}}

      【版本 B】
      {{story_v2}}

      请从人物塑造、情节结构、文笔语言、主题表达四个维度(各10分)综合评判,
      严格输出如下 JSON(不要 markdown 代码块,不要额外文字):
      {
        "winner": "A" 或 "B",
        "score_a": 数字,
        "score_b": 数字,
        "comment_a": "版本A的优缺点简评",
        "comment_b": "版本B的优缺点简评",
        "reason": "最终选择该版本的核心理由"
      }
    output: verdict

  # 4. 根据裁决选择最优版本输出为 HTML
  - id: pick_best
    type: condition
    when: "{{verdict.winner}} == 'A'"
    then:
      - id: export_v1
        type: tool
        tool: md.convert
        params:
          content: "{{story_v1}}"
          formats:
            - html
          output_dir: ./output
          output_name: "{{protagonist}}_best"
        output: best_html
    else:
      - id: export_v2
        type: tool
        tool: md.convert
        params:
          content: "{{story_v2}}"
          formats:
            - html
          output_dir: ./output
          output_name: "{{protagonist}}_best"
        output: best_html

  # 5. 把裁决转为可读书评报告并输出 HTML
  - id: review_report
    type: llm
    agent: reviewer
    prompt: |
      请基于以下评分裁决,撰写一份专业的 Markdown 书评报告。

      主角:{{character_profile.name}}
      最优版本:{{verdict.winner}}

      裁决详情:
      - 版本A得分:{{verdict.score_a}} —— {{verdict.comment_a}}
      - 版本B得分:{{verdict.score_b}} —— {{verdict.comment_b}}
      - 选择理由:{{verdict.reason}}

      报告要求(Markdown):
      1. 标题《{{character_profile.name}}》双版本评审报告
      2. 两版本得分对比
      3. 各版本优缺点分析
      4. 最终推荐与理由
    output: review_markdown

  - id: convert_review
    type: tool
    tool: md.convert
    params:
      content: "{{review_markdown}}"
      formats:
        - html
      output_dir: ./output
      output_name: "{{protagonist}}_review"
    output: review_html_result
