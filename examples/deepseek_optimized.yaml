# DeepSeek 深度优化工作流示例
# 展示 Pro(思考模式) + Flash(快速模式) + JSON Output 协作

name: deepseek_optimized
inputs:
  - user_question

# 提供商配置:DeepSeek 两个内置预设
# - deepseek:       Pro 模型,默认开启思考模式,适合复杂推理
# - deepseek-flash: Flash 模型,默认非思考模式,适合快速简单任务
# 两者共享同一 base_url 与 api_key,仅需覆盖 api_key。
providers:
  - name: deepseek
    api_key: ${DEEPSEEK_API_KEY}
    options:
      thinking: enabled          # 开启思考模式
      reasoning_effort: high     # 思考强度:high / max
      json_output: false         # 全局 JSON Output(需要时在 Agent 级开)

  - name: deepseek-flash
    api_key: ${DEEPSEEK_API_KEY}
    options:
      thinking: disabled         # Flash 默认非思考模式(更快更便宜)
      json_output: false

  # 自定义 OpenAI 兼容提供商示例(本地部署 / Azure 等)
  # 需提供完整 base_url + api_key + model
  # - name: my_local
  #   base_url: http://localhost:8000/v1
  #   api_key: local-key
  #   model: llama-3-70b

agents:
  # 推理 Agent:用 DeepSeek Pro 思考模式解决复杂问题
  - name: reasoner
    model: deepseek-v4-pro
    system: |
      你是一个严谨的推理助手。请逐步思考后给出答案。
      涉及计算时务必验证结果。
    temperature: 0.1
    max_tool_iterations: 0

  # 结构化输出 Agent:用 Flash 模型快速完成简单格式化任务
  - name: structurer
    model: deepseek-v4-flash
    system: |
      你是结构化输出助手。将输入信息整理为 JSON 格式。
      输出必须为合法 JSON,包含以下字段:
      {
        "answer": "答案内容",
        "confidence": "high/medium/low",
        "sources": ["来源1", "来源2"]
      }
    temperature: 0.0
    max_tool_iterations: 0

steps:
  # Step 1:DeepSeek Pro 思考模式推理
  - id: reason
    type: llm
    agent: reasoner
    prompt: "{{user_question}}"
    output: reasoning_result

  # Step 2:Flash 快速结构化为 JSON
  - id: structure
    type: llm
    agent: structurer
    prompt: |
      问题: {{user_question}}
      推理结果: {{reasoning_result}}
      请整理为结构化 JSON 输出。
    output: final_answer
    output_format: json
