# MiMo 多模态工作流示例
#
# 演示 MiMo 全模态模型(mimo-v2.5)的图片 / 音频 / 视频理解能力。
# 需要 MIMO_API_KEY 环境变量。
#
# 运行: python -m agentkit.cli run examples/mimo_multimodal.yaml

name: mimo_multimodal_example

# MiMo 提供商配置(预设 mimo / mimo-omni 可直接覆盖)
providers:
  - name: mimo
    api_key: ${MIMO_API_KEY}
  - name: mimo-omni
    api_key: ${MIMO_API_KEY}

agents:
  # 文本推理 Agent(Pro 模型)
  - name: text_agent
    model: mimo-v2.5-pro
    system: "你是小米 MiMo AI 助手,擅长深度推理与文本分析。"
    temperature: 0.3

  # 多模态 Agent(全模态模型)
  - name: vision_agent
    model: mimo-v2.5
    system: "你是小米 MiMo 多模态 AI 助手,擅长理解图片、音频与视频内容。"
    temperature: 0.3
    max_tool_iterations: 3

steps:
  # ---- 示例 1:图片理解(交错文本与图片) ----
  - id: analyze_images
    type: llm
    agent: vision_agent
    output: image_analysis
    prompt:
      - {type: text, text: "请仔细看这张图片:"}
      - {type: image_url, image_url: {url: "{{image_url_1}}"}}
      - {type: text, text: "然后对比这张:"}
      - {type: image_url, image_url: {url: "{{image_url_2}}"}}
      - {type: text, text: "描述两张图片的主要内容,并指出关键差异。"}

  # ---- 示例 2:视频理解(带 fps 参数) ----
  - id: analyze_video
    type: llm
    agent: vision_agent
    output: video_analysis
    prompt:
      - {type: text, text: "请分析以下视频内容,提取关键动作与场景:"}
      - type: video_url
        video_url: {url: "{{video_url}}"}
        fps: 2
        media_resolution: default

  # ---- 示例 3:音频理解 ----
  - id: analyze_audio
    type: llm
    agent: vision_agent
    output: audio_analysis
    prompt:
      - {type: text, text: "请听以下音频并转写内容:"}
      - {type: input_audio, input_audio: {data: "{{audio_url}}"}}

  # ---- 示例 4:纯文本推理(Pro 模型 + 思考模式) ----
  - id: text_reasoning
    type: llm
    agent: text_agent
    output: reasoning_result
    stream: true
    prompt: "证明:对于任意正整数 n,n^3 - n 能被 6 整除。请逐步推理。"
