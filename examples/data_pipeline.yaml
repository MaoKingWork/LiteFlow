# 场景 C:数据管道(并行扇出 + 批量处理)
# 并行查询多数据源 → 批量 LLM 处理 → 汇总报告

name: data_pipeline
inputs:
  - report_date

agents:
  - name: processor
    model: gpt-4o-mini
    system: |
      你是数据处理助手。对单条数据记录生成结构化摘要。
      输出格式:JSON,含 summary 和 metrics 字段。
    temperature: 0.2
    max_tool_iterations: 0

  - name: summarizer
    model: gpt-4o-mini
    system: |
      你是汇总报告生成器。将多条数据摘要合并为一份完整的日报。
      报告应包含:总体趋势、关键发现、建议行动。
    temperature: 0.3
    max_tool_iterations: 0

steps:
  # 并行查询三个数据源
  - id: fan_out
    type: parallel
    max_concurrency: 3
    on_error: collect_all
    branches:
      - id: fetch_orders
        type: tool
        tool: db.query
        params:
          sql: "SELECT * FROM orders WHERE date='{{report_date}}'"
        output: orders_data

      - id: fetch_users
        type: tool
        tool: db.query
        params:
          sql: "SELECT * FROM users WHERE created_at='{{report_date}}'"
        output: users_data

      - id: fetch_revenue
        type: tool
        tool: db.query
        params:
          sql: "SELECT * FROM revenue WHERE date='{{report_date}}'"
        output: revenue_data

  # 批量处理订单数据
  - id: process_orders
    type: loop
    iter: "{{orders_data.rows}}"
    item_var: order
    max: 50
    step:
      id: process_one
      type: llm
      agent: processor
      prompt: "处理订单: {{order}}"
      output: processed_orders

  # 生成汇总报告
  - id: generate_report
    type: llm
    agent: summarizer
    prompt: |
      日期: {{report_date}}
      订单处理结果: {{processed_orders}}
      用户数据: {{users_data}}
      收入数据: {{revenue_data}}
      请生成汇总日报。
    output: final_report
