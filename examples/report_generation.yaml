# 场景 D:报告生成(集成 report_engine_sdk)
# LLM 分析数据 → 调用 report.generate 工具生成 Markdown 报告
#
# 前置条件:
#   1. report_engine_sdk 已安装(pip install -e ./report_engine_sdk)
#   2. 代码中已调用 create_report_tool(engine) 注册工具
#
# 代码侧初始化示例:
#   from report_engine_sdk import ReportEngine, LocalStorage
#   from agentkit.tools.report_engine import create_report_tool
#   engine = ReportEngine("./report_engine_sdk/config", LocalStorage("./output"))
#   create_report_tool(engine)

name: report_generation
inputs:
  - user_name
  - raw_data

agents:
  - name: data_analyzer
    model: gpt-4o-mini
    system: |
      你是数据分析助手。根据用户提供的原始数据,提取关键信息,
      整理为结构化的报告输入数据。
      你拥有 report.generate 工具,可以在分析完成后调用它生成报告。
    temperature: 0.2
    tools:
      - report.generate
    max_tool_iterations: 3

steps:
  - id: analyze_and_report
    type: llm
    agent: data_analyzer
    prompt: |
      用户: {{user_name}}
      原始数据: {{raw_data}}
      请分析数据并调用 report.generate 工具生成工作简报。
      报告 ID: work_report:daily_briefing
      视图: summary
    output: report_result
