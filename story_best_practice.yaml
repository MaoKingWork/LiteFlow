name: story_best_practice
inputs:
- protagonist
providers:
- name: mimo
  api_key: sk-***
  model: mimo-v2.5
  options:
    thinking: disabled
agents:
- name: character_designer
  model: mimo-v2.5
  provider: mimo
  system: '

    你是资深角色设计师,擅长为小说构建立体的人物设定。


    严格输出 JSON,不要附加任何说明文字。

    '
  temperature: 0.6
- name: writer_ardent
  model: mimo-v2.5
  provider: mimo
  system: '

    你是擅长热血冒险风格的小说家,节奏明快、冲突强烈、画面感强。


    根据上下文续写章节,保持文风一致与剧情连贯。

    '
  temperature: 0.9
- name: writer_lyric
  model: mimo-v2.5
  provider: mimo
  system: '

    你是擅长细腻抒情风格的小说家,注重心理刻画、氛围渲染、语言优美。


    根据上下文续写章节,保持文风一致与剧情连贯。

    '
  temperature: 0.7
- name: judge
  model: mimo-v2.5
  provider: mimo
  system: '

    你是公正严谨的文学评委。对比两部小说后严格输出 JSON,不要附加说明文字。

    '
  temperature: 0.2
- name: reviewer
  model: mimo-v2.5
  provider: mimo
  system: '

    你是文学评论撰稿人,把结构化评分转为专业可读的 Markdown 书评报告。

    '
  temperature: 0.4
steps:
- id: setup_character
  type: llm
  agent: character_designer
  output_format: json
  prompt: "\n请为名为\"{{protagonist}}\"的主角设计一份短篇小说人物档案。\n\n严格输出如下 JSON(不要 markdown 代码块,不要额外文字):\n\
    \n{\n\n  \"name\": \"主角名\",\n\n  \"age\": 年龄数字,\n\n  \"background\": \"100字以内的背景设定\"\
    ,\n\n  \"story_type\": \"故事类型,如奇幻/悬疑/科幻/言情\"\n\n}\n"
  output: character_profile
  outputs: null
- id: generate
  max_concurrency: 2
  timeout: 180
  branches:
  - id: gen_v1
    type: loop
    iter: '[1, 2, 3]'
    as: chapter_num
    output_mode: append
    output: story_v1
    separator: '


      '
    step:
      id: write_v1
      type: llm
      agent: writer_ardent
      prompt: '

        主角档案:


        - 姓名:{{character_profile.name}}


        - 年龄:{{character_profile.age}}


        - 背景:{{character_profile.background}}


        - 故事类型:{{character_profile.story_type}}




        {{#if story_v1}}


        前文(完整,禁止修改):


        ---


        {{story_v1}}


        ---




        任务:续写第{{chapter_num}}章。


        {{#else}}


        任务:为上述主角创作第1章。


        {{/if}}


        输出格式(严格遵守):


        - 必须以 `## 第{{chapter_num}}章 标题` 开头


        - 只输出本章新内容,严禁重复前文


        - 字数 600-900 字


        - 不要输出任何说明性文字

        '
      output: story_v1
    ui:
      collapsed: true
  - id: gen_v2
    type: loop
    iter: '[1, 2, 3]'
    as: chapter_num
    output_mode: append
    output: story_v2
    separator: '


      '
    step:
      id: write_v2
      type: llm
      agent: writer_lyric
      prompt: '

        主角档案:


        - 姓名:{{character_profile.name}}


        - 年龄:{{character_profile.age}}


        - 背景:{{character_profile.background}}


        - 故事类型:{{character_profile.story_type}}




        {{#if story_v2}}


        前文(完整,禁止修改):


        ---


        {{story_v2}}


        ---




        任务:续写第{{chapter_num}}章。


        {{#else}}


        任务:为上述主角创作第1章。


        {{/if}}


        输出格式(严格遵守):


        - 必须以 `## 第{{chapter_num}}章 标题` 开头


        - 只输出本章新内容,严禁重复前文


        - 字数 600-900 字


        - 不要输出任何说明性文字

        '
      output: story_v2
    ui:
      collapsed: true
  type: parallel
  ui:
    collapsed: false
- id: judge
  type: llm
  agent: judge
  output_format: json
  prompt: "\n你正在评审主角\"{{character_profile.name}}\"的两部同题短篇小说。\n\n\n\n【版本 A】\n\n{{story_v1}}\n\
    \n\n\n【版本 B】\n\n{{story_v2}}\n\n\n\n请从人物塑造、情节结构、文笔语言、主题表达四个维度(各10分)综合评判,\n\n严格输出如下\
    \ JSON(不要 markdown 代码块,不要额外文字):\n\n{\n\n  \"winner\": \"A\" 或 \"B\",\n\n  \"score_a\"\
    : 数字,\n\n  \"score_b\": 数字,\n\n  \"comment_a\": \"版本A的优缺点简评\",\n\n  \"comment_b\"\
    : \"版本B的优缺点简评\",\n\n  \"reason\": \"最终选择该版本的核心理由\"\n\n}\n"
  output: verdict
- id: pick_best
  type: condition
  when: '{{verdict.winner}} == ''A'''
  then:
  - id: export_v1
    type: tool
    tool: md.convert
    params:
      content: '{{story_v1}}'
      formats:
      - html
      output_dir: ./output
      output_name: '{{protagonist}}_best'
    output: best_html
  else:
  - id: export_v2
    type: tool
    tool: md.convert
    params:
      content: '{{story_v2}}'
      formats:
      - html
      output_dir: ./output
      output_name: '{{protagonist}}_best'
    output: best_html
- id: review_report
  type: llm
  agent: reviewer
  prompt: '

    请基于以下评分裁决,撰写一份专业的 Markdown 书评报告。




    主角:{{character_profile.name}}


    最优版本:{{verdict.winner}}




    裁决详情:


    - 版本A得分:{{verdict.score_a}} —— {{verdict.comment_a}}


    - 版本B得分:{{verdict.score_b}} —— {{verdict.comment_b}}


    - 选择理由:{{verdict.reason}}




    报告要求(Markdown):


    1. 标题《{{character_profile.name}}》双版本评审报告


    2. 两版本得分对比


    3. 各版本优缺点分析


    4. 最终推荐与理由

    '
  output: review_markdown
- id: convert_review
  type: tool
  tool: md.convert
  params:
    content: '{{review_markdown}}'
    formats:
    - html
    output_dir: ./output
    output_name: '{{protagonist}}_review'
  output: review_html_result
ui: {}
